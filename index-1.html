async function fetchGeo(url){const response=await fetch(url,{cache:'force-cache'});if(!response.ok)throw Error('HTTP '+response.status);return response.json()}
async function loadBorders(){let myMap=map;const urls=[remoteURL+'estados.geojson','https://raw.githubusercontent.com/henriquemalvar/br-geojson/main/dist/estados.geojson'];for(let url of urls){try{let geo=await fetchGeo(url);if(map!==myMap)return;let fs=(geo.features||[]).filter(f=>NE.includes(String(f.properties.sigla||'').toUpperCase()));if(fs.length!==9)throw Error('Faltam estados');borders=L.geoJSON({type:'FeatureCollection',features:fs},{style:f=>({weight:1.6,color:'#9dc8dd',opacity:1,fillColor:({'MA':'#1f6599','PI':'#206c81','CE':'#164c80','RN':'#32648b','PB':'#246c89','PE':'#23557d','AL':'#34658d','SE':'#24637b','BA':'#214d80'})[f.properties.sigla],fillOpacity:.5}),onEachFeature:(f,l)=>l.bindTooltip(f.properties.nome||f.properties.sigla,{className:'nexotip',sticky:true})}).addTo(map);borders.bringToBack();if(!state.roads)map.fitBounds(borders.getBounds(),{padding:[15,15],animate:false});notice('9 estados reais carregados · aproxime para municípios');loadMunicipal();return}catch(e){console.warn('Falha em fonte cartográfica',url,e)}}notice('Limites reais indisponíveis. Verifique a conexão; não serão desenhadas divisas artificiais.')}
let municipalityCache={},loadingMu={};async function loadMunicipal(){if(!map||!borders)return;if(map.getZoom()<8){Object.values(cityOutline).forEach(l=>map.hasLayer(l)&&map.removeLayer(l));cityOutline={};return}const current=map.getBounds();const ufs=[];borders.eachLayer(l=>{if(l.getBounds&&l.getBounds().intersects(current)){let uf=l.feature?.properties?.sigla;if(uf)ufs.push(uf)}});for(let uf of Object.keys(cityOutline)){if(!ufs.includes(uf)){map.removeLayer(cityOutline[uf]);delete cityOutline[uf]}}for(const uf of ufs.slice(0,2)){if(cityOutline[uf]||loadingMu[uf])continue;loadingMu[uf]=true;let m=map;try{const geo=municipalityCache[uf]||await fetchGeo(remoteURL+`municipios/${uf}.geojson`);municipalityCache[uf]=geo;if(map!==m||map.getZoom()<8)continue;cityOutline[uf]=L.geoJSON(geo,{style:{weight:.8,color:'#9fd9ed',opacity:.6,fillOpacity:0},onEachFeature:(f,l)=>l.bindTooltip(f.properties.nome||'Município',{className:'nexotip',sticky:true})}).addTo(map);if(borders)borders.bringToBack();notice(`Municípios reais: ${Object.keys(cityOutline).join(', ')} • IBGE`)}catch(e){notice('Divisões municipais indisponíveis. Tente novamente com internet.')}finally{delete loadingMu[uf]}}}
function refreshPins(){if(!map)return;if(pinsLayer)map.removeLayer(pinsLayer);pinsLayer=L.layerGroup().addTo(map);const zoom=map.getZoom();for(let st of registry.estados){if(state.uf!=='todas'&&state.uf!==st.uf)continue;const list=allFor(st.uf);if(!list.length)continue;if(zoom<8){const opened=list.some(x=>statusFor(x.id)==='aberto');let mk=L.marker([st.lat,st.lon],{icon:pinIcon(opened?'hasopen':'city',String(list.length))}).addTo(pinsLayer);mk.bindTooltip(`${st.capital}: ${list.length} instituições`,{className:'nexotip'});mk.on('click',()=>showCity(st,list));mk.on('dblclick',()=>map.setView([st.lat,st.lon],9));}else{const n=list.length;list.forEach((x,i)=>{let angle=(Math.PI*2*i)/n;let offset=zoom>=11?0.018:0.07;let lat=st.lat+offset*Math.sin(angle),lon=st.lon+offset*Math.cos(angle);let stat=statusFor(x.id),cls=stat==='aberto'?'dpe':stat==='encerrado'?'ended':'waiting';let mk=L.marker([lat,lon],{icon:pinIcon(cls,x.group.substring(0,2)),zIndexOffset:100}).addTo(pinsLayer);mk.bindTooltip(x.nome+' · marcador esquemático da cidade',{className:'nexotip',direction:'top'});let last=0;mk.on('click',()=>{let now=Date.now();if(now-last<440){setTab('tree',x.id)}else{showInstitution(x);last=now}});mk.on('dblclick',e=>{L.DomEvent.stop(e);setTab('tree',x.id)})})}}}
function showCard(html){const c=$('#card');if(!c)return;c.classList.remove('hide');c.innerHTML=`<button class="close" id="cardClose" aria-label="Fechar">×</button>${html}`;$('#cardClose').onclick=()=>c.classList.add('hide')}
function showCity(st,list){showCard(`<div class="caps">${escapeHtml(st.nome)} · ${escapeHtml(st.capital)}</div><h2>${list.length} instituições monitoradas</h2><p class="names">Escolha a instituição para consultar o resumo. O endereço do prédio ainda exige validação.</p><div class="scroll">${list.map(x=>`<button class="item" data-inst="${escapeHtml(x.id)}"><strong>${escapeHtml(x.nome)}</strong><small>${escapeHtml(x.group)} • ${statusFor(x.id)==='nao_verificado'?'não verificado':statusFor(x.id)}</small></button>`).join('')}</div>`);$$('[data-inst]').forEach(b=>b.onclick=()=>showInstitution(models.find(x=>x.id===b.dataset.inst)))}
function showInstitution(o){state.selected=o.id;let cs=contestsOf(o),st=statusFor(o.id);showCard(`<div class="caps">${escapeHtml(o.group)} · ${escapeHtml(o.uf)}</div><h2>${escapeHtml(o.nome)}</h2><p class="names">${escapeHtml(o.municipio)} — ${escapeHtml(o.estado)}</p><div style="margin:7px 0">${badge(st)}</div><div class="small"><b>Cargos:</b> ${escapeHtml(cs.length?cs.map(c=>c.cargo).join(' · '):o.cargos_referencia.join(' · '))}</div><div class="box"><strong>🚗 Distância por estrada desde Exu</strong><p id="routeStatus" class="small muted" style="margin:6px 0">Não calculada. É necessário confirmar a localização do edifício, não apenas a cidade.</p><button class="btn alt" id="routeBtn">Localizar prédio e calcular rota</button></div><div class="buttons"><button id="treeButton" class="btn">Abrir árvore ↳</button>${o.portal?`<a class="btn alt" href="${safeURL(o.portal)}" target="_blank" rel="noopener">Fonte oficial ↗</a>`:''}</div><div class="tiny muted" style="margin-top:8px">Toque duplo diretamente no marcador abre a árvore. Pins agrupados estão na referência municipal.</div>`);$('#treeButton').onclick=()=>setTab('tree',o.id);$('#routeBtn').onclick=()=>routeFor(o)}
async function routeFor(o){let r=$('#routeStatus');r.textContent='Procurando o endereço oficial da instituição…';try{let address=officeLocations[o.id];if(!address){let query=encodeURIComponent(`${o.nome} ${o.municipio} ${o.estado} Brasil`);let res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=5&q=${query}`);if(!res.ok)throw Error('Geocodificação indisponível');let candidates=await res.json();let candidate=candidates.find(x=>{const d=x.address||{};return (d.office||d.building||d.amenity||d.road||d.house_number)&&String(x.display_name).toLowerCase().includes(o.municipio.toLowerCase())});if(!candidate)throw Error('Endereço exato não identificado. Distância não calculada para evitar erro.');address={lat:+candidate.lat,lon:+candidate.lon,name:candidate.display_name};officeLocations[o.id]=address}r.textContent='Endereço identificado; calculando rota rodoviária…';const url=`https://router.project-osrm.org/route/v1/driving/${Exu.lon},${Exu.lat};${address.lon},${address.lat}?overview=full&geometries=geojson`;let res=await fetch(url);if(!res.ok)throw Error('Serviço de rotas indisponível');const routes=await res.json(),one=routes.routes?.[0];if(!one)throw Error('Rota rodoviária não encontrada');let km=one.distance/1000,h=one.duration/3600;r.textContent=`${km.toFixed(1).replace('.',',')} km por estrada · ${h.toFixed(1).replace('.',',')} h estimadas. Endereço: ${address.name}`;if(routeLine)map.removeLayer(routeLine);routeLine=L.geoJSON(one.geometry,{style:{color:'#37ead8',weight:5,opacity:.86}}).addTo(map);map.fitBounds(routeLine.getBounds(),{padding:[14,14]})}catch(e){r.textContent='Não foi possível calcular uma distância confiável: '+e.message}}

function aiScreen(){return `<section class="screen">${screenHeader('LEITURA E EXTRAÇÃO','Assistente de editais')}<p class="small muted">Importe um PDF oficial ou forneça a página da banca. Informações críticas devem manter o vínculo com a fonte.</p><div class="box"><div class="caps">1. Fonte do edital</div><input class="input" id="editalURL" type="url" placeholder="https://banca-oficial.../edital.pdf" style="margin:8px 0"><input class="input" type="file" id="editalFile" accept="application/pdf,text/plain,.txt,.pdf"><div class="buttons" style="margin-top:9px"><button class="btn" id="analyze">✧ Analisar no sistema</button><button class="btn alt" id="sourceSearch">Buscar nas fontes oficiais</button></div><div id="aiResult" class="small muted" style="margin:12px 0"></div></div><div class="box"><b>O que será extraído</b><p class="small muted">Cargo, requisitos, matérias, etapas, redação, TAF, vagas, salário, benefícios, lotação, inscrições, banca e links. Campos sem evidência permanecem pendentes.</p></div><div class="box"><b>IA opcional</b><p class="small muted">Na edição hospedada, o servidor poderá analisar PDFs e usar um modelo de IA configurado pelo responsável. Nenhuma chave de API deve ser colocada neste arquivo HTML.</p></div></section>`}
function bindAi(){$('#sourceSearch').onclick=()=>window.open('https://www.concursosfcc.com.br/concursoAndamento.html','_blank','noopener');$('#analyze').onclick=async()=>{let output=$('#aiResult'),url=$('#editalURL').value.trim(),file=$('#editalFile').files[0];if(!url&&!file){output.textContent='Informe uma URL oficial ou selecione um PDF.';return}output.textContent='Verificando disponibilidade do analisador…';try{let form=new FormData();if(file)form.append('file',file);if(url)form.append('url',url);const res=await fetch('/api/analisar',{method:'POST',body:form});if(!res.ok)throw Error('Serviço não ativado neste arquivo HTML');let data=await res.json();output.innerHTML=`<b>Resultado:</b> ${escapeHtml(JSON.stringify(data.campos||data,null,2))}`;}catch(e){output.innerHTML=`<span class="mutedalert">O analisador precisa estar publicado com o backend da pasta do projeto.</span> ${escapeHtml(e.message)}<br>Você pode abrir a fonte oficial pelo navegador e consultar as informações diretamente. Nenhum dado foi inventado.`}}}
function favScreen(){return `<section class="screen">${screenHeader('PRIORIDADES PESSOAIS','Instituições favoritas')}<p class="small muted">A seleção fica salva no navegador deste dispositivo.</p><div class="box"><div class="row"><b>${state.favorites.size} favoritas</b><span class="chip">Total ${models.length}</span></div><input class="input" id="favSearch" placeholder="Procurar instituição" style="margin:9px 0"><div class="scroll" id="favList"></div></div></section>`}
function bindFav(){$('#favSearch').oninput=refreshFav;refreshFav()}
function refreshFav(){let q=$('#favSearch').value.trim().toLowerCase(),arr=models.filter(o=>!q||(o.nome+' '+o.uf+' '+o.group).toLowerCase().includes(q));if(!q)arr.sort((a,b)=>Number(state.favorites.has(b.id))-Number(state.favorites.has(a.id)));$('#favList').innerHTML=arr.slice(0,150).map(o=>`<div class="row item"><label style="flex:1"><input type="checkbox" data-favid="${escapeHtml(o.id)}" ${state.favorites.has(o.id)?'checked':''}> ${escapeHtml(o.nome)} <span class="muted tiny">${o.uf}</span></label><button class="btn ghost" data-view="${escapeHtml(o.id)}">↗</button></div>`).join('');$$('[data-favid]').forEach(c=>c.onchange=()=>{c.checked?state.favorites.add(c.dataset.favid):state.favorites.delete(c.dataset.favid);persistFav()});$$('[data-view]').forEach(b=>b.onclick=()=>setTab('tree',b.dataset.view))}
render();
readDaily().then(x=>{dailyData=x;const msg=$('#mapnotice');if(msg&&state.tab==='map')msg.title='Última execução da agenda: '+x.checked_at}).catch(()=>{});
</script></body></html>
